<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche prospective · DPE Aldev</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/dvpe.css">
</head>
<body>
<nav class="barre-nav"><a href="index.html">Accueil DPE</a><a href="barometre.html">Baromètre</a><a href="agence/indicateurs.html">Indicateurs d'agence</a><a href="prospectives.html">Prospectives</a><button type="button" class="bouton-pdf" id="bouton-pdf">Exporter en PDF</button></nav>
<main class="fiche" id="fiche" aria-live="polite"></main>
<script src="assets/dvpe.js"></script>
<script src="data/prospectives.js"></script>
<script>
  // fiche.html?n=3 → data/fiches/fiche-03.js
  const el = document.getElementById("fiche");
  const n = parseInt(new URLSearchParams(location.search).get("n") || "1", 10);
  DVPE.charger(DVPE.fichier(n))
    .then(() => { if (!DVPE.fiches[n]) throw new Error("Fiche " + n + " absente"); el.innerHTML = DVPE.rendreFiche(DVPE.fiches[n]); DVPE.ouvrirSources(); })
    .catch(e => DVPE.erreur(el, e));
  addEventListener("hashchange", DVPE.ouvrirSources);
  // Export PDF : impression navigateur (« Enregistrer au format PDF »), une page A4 portrait
  document.getElementById("bouton-pdf").addEventListener("click", () => window.print());
  addEventListener("beforeprint", DVPE.preparerImpression);
  addEventListener("afterprint", DVPE.finirImpression);
</script>
</body>
</html>
